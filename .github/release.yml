# Categories for the notes that GitHub generates automatically (gh release create --generate-notes).
# The release workflow (.github/workflows/release.yml) writes its own notes from CHANGELOG.en.md and does not use this file.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security
      labels:
        - security
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Other changes
      labels:
        - "*"
