# Release of SelfX Service: runs only when a version tag (v<major>.<minor>.<patch>) is pushed.
# It builds the programs, the Intune package (.intunewin), the payload archive (programs, code and default configuration plus the package
# tools), the SBOM and SHA256SUMS.txt, writes the release notes from CHANGELOG.en.md and PUBLISHES the release automatically. It does so only
# when, in the same run,
#   - all tests of the CI workflow (service-ci.yml) passed for the tagged commit,
#   - the notes exist (the version has a section in CHANGELOG.en.md) and
#   - the files that are uploaded were checked against SHA256SUMS.txt.
# If one of these fails, no release is created. The repository variable RELEASE_DRAFT=true creates a draft instead of a published release;
# the repository variable RELEASE_ATTEST=false turns the build provenance attestation of the payload archive off.
# No secret is used. The default of the token is read-only; each job raises only what it needs, and the token that can write releases
# is handed to the last step of the last job only.
name: SelfX Service release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  # The tests of the CI workflow, run for the tagged commit in this run. Publishing waits for them.
  ci:
    name: CI tests of the tagged commit
    uses: ./.github/workflows/service-ci.yml
    permissions:
      contents: read

  build:
    name: Build the release files
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Microsoft Win32 Content Prep Tool (builds the .intunewin). Pinned by tag; the script also requires a valid Microsoft
      # Authenticode signature. Optional hardening: set the repository variable INTUNEWINAPPUTIL_SHA256 to pin the file hash.
      INTUNEWINAPPUTIL_TAG: v1.8.7
      INTUNEWINAPPUTIL_SHA256: ${{ vars.INTUNEWINAPPUTIL_SHA256 }}
      RELEASE_ATTEST: ${{ vars.RELEASE_ATTEST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag matches Version.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The version of the code is the only line of 'SelfX Service/Version.txt' (the build writes it into SelfX.Code.json).
          $lines = @((Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'SelfX Service/Version.txt')) | Where-Object { $_.Trim().Length -gt 0 })
          if ($lines.Count -ne 1) { throw 'Version.txt must contain exactly one line with the version.' }
          $version = $lines[0].Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid version '$version' in Version.txt (expected <major>.<minor>.<patch>)." }
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match Version.txt $version." }
          "Release $version"
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # First, so a missing section stops the run before anything is built.
      - name: Release notes from CHANGELOG.en.md (the version needs a section)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          . (Join-Path $root 'tools/SelfXRelease.Common.ps1')
          $attested = ($env:RELEASE_ATTEST -ne 'false')
          $notes = New-SelfXReleaseNotes -ChangelogPath (Join-Path $root 'CHANGELOG.en.md') -Version $env:RELEASE_VERSION -Repository $env:GITHUB_REPOSITORY -Attested $attested
          $folder = Join-Path $root 'notes'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $folder 'RELEASE_NOTES.md'), $notes, (New-Object System.Text.UTF8Encoding($false)))
          $notes

      - name: Build the programs (tools\Build-SelfXBinaries.ps1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'tools\Build-SelfXBinaries.ps1')

      - name: Download the Content Prep Tool (pinned tag)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Join-Path $env:RUNNER_TEMP 'IntuneWinAppUtil.exe'
          $url = "https://raw.githubusercontent.com/microsoft/Microsoft-Win32-Content-Prep-Tool/$env:INTUNEWINAPPUTIL_TAG/IntuneWinAppUtil.exe"
          Invoke-WebRequest -Uri $url -OutFile $tool -UseBasicParsing
          $hash = (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash
          "IntuneWinAppUtil.exe $env:INTUNEWINAPPUTIL_TAG SHA-256 $hash"
          if ($env:INTUNEWINAPPUTIL_SHA256 -and $hash -ne $env:INTUNEWINAPPUTIL_SHA256.Trim()) { throw 'IntuneWinAppUtil.exe does not match INTUNEWINAPPUTIL_SHA256.' }
          # New-SelfXIntuneWin.ps1 requires a valid Microsoft Authenticode signature.
          "TOOL_PATH=$tool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TOOL_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the Intune package, the payload archive, the SBOM and the SHA-256 list
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          . (Join-Path $root 'tools\SelfXRelease.Common.ps1')
          $names = Get-SelfXReleaseFileNames -Version $env:RELEASE_VERSION
          $build = Join-Path $root 'build'
          & (Join-Path $root 'tools\New-SelfXIntuneWin.ps1') -ToolPath $env:TOOL_PATH -PayloadFile (Join-Path $build $names.Payload)
          if ($LASTEXITCODE -ne 0) { throw 'New-SelfXIntuneWin.ps1 failed.' }
          & (Join-Path $root 'tools\New-SelfXSbom.ps1')
          # By-product of Build-SelfXBinaries.ps1 (AppLocker hash rules of this build); it is not a release file.
          Remove-Item -LiteralPath (Join-Path $build 'SelfX.AppLocker.xml') -Force -ErrorAction SilentlyContinue
          $count = New-SelfXChecksumFile -Folder $build -Comment @("Build tool: IntuneWinAppUtil.exe $env:INTUNEWINAPPUTIL_TAG SHA-256 $($env:TOOL_SHA256.ToLowerInvariant())")
          "SHA256SUMS.txt lists $count files."
          Get-Content -LiteralPath (Join-Path $build 'SHA256SUMS.txt')

      - name: Check the release files (exact file set, SHA256SUMS.txt, payload archive)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          . (Join-Path $root 'tools\SelfXRelease.Common.ps1')
          $names = Get-SelfXReleaseFileNames -Version $env:RELEASE_VERSION
          $build = Join-Path $root 'build'
          $problems = @(Get-SelfXChecksumProblems -Folder $build -ExpectedFiles @($names.Values))
          $problems += @(Get-SelfXPayloadArchiveProblems -Path (Join-Path $build $names.Payload))
          foreach ($problem in $problems) { Write-Output "::error::$problem" }
          if ($problems.Count -gt 0) { throw "$($problems.Count) problem(s) in the release files." }
          Get-ChildItem -LiteralPath $build -File | Sort-Object Name | Format-Table Name, Length -AutoSize | Out-String -Width 200

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: build
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes
          if-no-files-found: error
          retention-days: 7

  # Optional: build provenance of the payload archive (GitHub artifact attestation; free for public repositories).
  # Turn it off with the repository variable RELEASE_ATTEST=false. Only this job gets the rights for the attestation.
  attest:
    name: Build provenance of the payload archive
    needs: build
    if: ${{ vars.RELEASE_ATTEST != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/SelfX-Service-*-payload.zip

  # The only job that can write releases. It runs no code of the repository: the files come from the build job, are checked against
  # SHA256SUMS.txt and are uploaded to a draft that is published only after the upload has worked.
  publish:
    name: Check the files and publish the release
    needs: [ci, build, attest]
    if: ${{ !cancelled() && needs.ci.result == 'success' && needs.build.result == 'success' && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      # The token is used in this step only (it downloads the files of this run and creates the release).
      - name: Check the files against SHA256SUMS.txt and create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_DRAFT: ${{ vars.RELEASE_DRAFT }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          mkdir release notes
          gh run download "$GITHUB_RUN_ID" --name release-files --dir release
          gh run download "$GITHUB_RUN_ID" --name release-notes --dir notes
          [ -s notes/RELEASE_NOTES.md ] || { echo "::error::The release notes are missing or empty."; exit 1; }

          # The folder holds exactly the four release files and SHA256SUMS.txt, the list has only well-formed lines and names exactly
          # those four files, and every hash matches.
          wanted=$(printf '%s\n' "SelfX-Service-${version}.intunewin" "SelfX-Service-${version}.Detection.ps1" "SelfX-Service-${version}-payload.zip" "SelfX-Service-${version}.sbom.cdx.json" | LC_ALL=C sort)
          (
            cd release
            [ -f SHA256SUMS.txt ] || { echo "::error::SHA256SUMS.txt is missing."; exit 1; }
            bad=$(grep -v -E '^(#.*|[0-9a-f]{64}  [A-Za-z0-9][A-Za-z0-9._-]*)?$' SHA256SUMS.txt || true)
            [ -z "$bad" ] || { echo "::error::SHA256SUMS.txt has a line in the wrong format."; exit 1; }
            grep -E '^[0-9a-f]{64}  ' SHA256SUMS.txt > "$RUNNER_TEMP/sums.txt"
            listed=$(awk '{print $2}' "$RUNNER_TEMP/sums.txt" | LC_ALL=C sort)
            present=$(ls -A | grep -v '^SHA256SUMS.txt$' | LC_ALL=C sort)
            [ "$listed" = "$wanted" ] || { echo "::error::SHA256SUMS.txt does not list exactly the release files."; exit 1; }
            [ "$present" = "$wanted" ] || { echo "::error::The files of the build job are not the release files."; exit 1; }
            sha256sum --check --strict "$RUNNER_TEMP/sums.txt"
          )

          # A release for this tag that already exists is never touched (a second run for the same tag stops here).
          if gh release view "$tag" > /dev/null 2>&1; then echo "::error::A release for $tag already exists."; exit 1; fi

          # Draft first; it is published only when the upload has worked. A failure removes the draft: no release is left behind.
          created=0
          finished=0
          cleanup() { if [ "$created" = 1 ] && [ "$finished" = 0 ]; then gh release delete "$tag" --yes || true; fi; }
          trap cleanup EXIT
          created=1
          gh release create "$tag" release/* --draft --verify-tag --title "SelfX Service ${version}" --notes-file notes/RELEASE_NOTES.md
          if [ "${RELEASE_DRAFT,,}" = "true" ]; then
            echo "RELEASE_DRAFT is true: the release stays a draft."
          else
            gh release edit "$tag" --draft=false
          fi
          finished=1
