# CI for SelfX Service: compiles the service, runs all isolated tests and a security-focused script analysis.
# Runs on GitHub-hosted Windows runners only; nothing is installed on a real device and no secret is used.
name: SelfX Service CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token: the workflow never writes to the repository.
permissions:
  contents: read

concurrency:
  group: service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Tests in Windows PowerShell 5.1 (Install, Uninstall, Detection, log collector syntax)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to a full commit SHA (tag in the comment); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only Install.ps1, Uninstall.ps1, Detection.ps1 and Collect-DeviceLogs.ps1 still have to run in Windows PowerShell 5.1
      # (Intune and Autopilot start them there). Everything else runs in PowerShell 7 (next job).
      - name: Run the tests of the scripts that must stay compatible with Windows PowerShell 5.1
        shell: powershell
        env:
          SELFX_TEST_TRACE: '1'
        run: |
          $failed = New-Object System.Collections.Generic.List[string]
          $tests = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'SelfX Service') -Filter 'Test-*.ps1' | Where-Object { $_.Name -in 'Test-Compat51.ps1', 'Test-Detection.ps1', 'Test-FileManifest.ps1', 'Test-InstallBinaries.ps1', 'Test-Uninstall.ps1' }) + @(Get-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'tools\Test-SelfXPackageWizard.ps1'), (Join-Path $env:GITHUB_WORKSPACE 'tools\Test-SelfXOfflineFeed.ps1'), (Join-Path $env:GITHUB_WORKSPACE 'tools\Test-SelfXAppLockerRules.ps1')) | Sort-Object Name
          if (@($tests).Count -ne 8) { throw 'The eight Windows PowerShell 5.1 tests were not found.' }
          foreach ($test in $tests) {
            Write-Output "::group::$($test.Name)"
            # Each test in its own process, so mocks and globals of one test cannot affect the next.
            # A test that does not end within 5 minutes is stopped and its output so far is shown.
            $outFile = Join-Path $env:RUNNER_TEMP "$($test.BaseName).out.txt"
            $errFile = Join-Path $env:RUNNER_TEMP "$($test.BaseName).err.txt"
            $process = Start-Process -FilePath 'powershell.exe' -PassThru -NoNewWindow `
              -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "`"$($test.FullName)`"" `
              -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            $null = $process.Handle   # keeps the exit code readable after the process ended
            $code = 0
            if (-not $process.WaitForExit(300000)) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
              $code = 124
              Write-Output "Timeout after 5 minutes."
            } else { $process.WaitForExit(); $code = $process.ExitCode }
            Get-Content -LiteralPath $outFile, $errFile -ErrorAction SilentlyContinue | Write-Output
            Write-Output '::endgroup::'
            if ($code -ne 0) { $failed.Add("$($test.Name) (exit code $code)"); Write-Output "::error::$($test.Name) failed with exit code $code" }
          }
          if ($failed.Count -gt 0) { throw "Failed tests: $($failed -join ', ')" }
          Write-Output "$($tests.Count) test scripts passed."

  script-analysis:
    name: PSScriptAnalyzer (security rules)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze SelfX Service and tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Fixed version from the PowerShell Gallery.
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Repository PSGallery -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.23.0
          $settings = Join-Path $env:GITHUB_WORKSPACE '.github\PSScriptAnalyzerSettings.psd1'
          $results = @('SelfX Service', 'tools') | ForEach-Object {
            Invoke-ScriptAnalyzer -Path (Join-Path $env:GITHUB_WORKSPACE $_) -Recurse -Settings $settings
          }
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 220
          foreach ($r in $results) { Write-Output "::error file=$($r.ScriptPath),line=$($r.Line)::$($r.RuleName): $($r.Message)" }
          if (@($results).Count -gt 0) { throw "$(@($results).Count) findings." }
          Write-Output 'No findings.'

  # Signing library (tools\SelfXSigning.ps1, trust mode "signature"): signs and checks with self-signed certificates that the test creates in
  # Cert:\CurrentUser\My of the runner (never LocalMachine) and removes again; their public parts are trusted in Cert:\CurrentUser\Root for the
  # time of the test. Both PowerShell editions, in parallel. The expiry tests (about 3 minutes) and the time stamp test run here only.
  signing-library:
    name: Signing library (${{ matrix.edition == 'powershell' && 'Windows PowerShell 5.1' || 'PowerShell 7' }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        edition: [powershell, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tests of tools\SelfXSigning.ps1
        shell: ${{ matrix.edition }}
        env:
          SELFX_TEST_SLOW: '1'
          SELFX_TEST_TIMESTAMP_URL: 'http://timestamp.digicert.com'
        run: |
          "PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))"
          & (Join-Path $env:GITHUB_WORKSPACE 'tools\Test-SelfXSigning.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Test-SelfXSigning.ps1 failed with exit code $LASTEXITCODE." }

  # All tests run in PowerShell 7 (the runtime of the service, the window and the status icon). Blocking.
  pwsh7-compatibility:
    name: Tests in PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run all Test-*.ps1 in PowerShell 7
        shell: pwsh
        env:
          SELFX_TEST_TRACE: '1'
        run: |
          Write-Output "PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))"
          $pwsh = (Get-Command pwsh).Source
          $rows = New-Object System.Collections.Generic.List[string]
          $failed = 0
          $tests = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'SelfX Service') -Filter 'Test-*.ps1') + @(Get-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'tools\Test-SelfXPackageWizard.ps1'), (Join-Path $env:GITHUB_WORKSPACE 'tools\Test-SelfXOfflineFeed.ps1'), (Join-Path $env:GITHUB_WORKSPACE 'tools\Test-SelfXAppLockerRules.ps1')) | Sort-Object Name
          foreach ($test in $tests) {
            Write-Output "::group::$($test.Name)"
            $outFile = Join-Path $env:RUNNER_TEMP "pwsh7-$($test.BaseName).out.txt"
            $errFile = Join-Path $env:RUNNER_TEMP "pwsh7-$($test.BaseName).err.txt"
            $process = Start-Process -FilePath $pwsh -PassThru -NoNewWindow `
              -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "`"$($test.FullName)`"" `
              -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            $null = $process.Handle
            if (-not $process.WaitForExit(300000)) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
              $code = 124
            } else { $process.WaitForExit(); $code = $process.ExitCode }
            Get-Content -LiteralPath $outFile, $errFile -ErrorAction SilentlyContinue | Select-Object -Last 60 | Write-Output
            Write-Output '::endgroup::'
            if ($code -eq 0) { $rows.Add("| $($test.Name) | passed |") } else { $failed++; $rows.Add("| $($test.Name) | FAILED (exit code $code) |") }
          }
          $summary = @("### Tests in PowerShell $($PSVersionTable.PSVersion) ", '', '| Test | Result |', '| --- | --- |') + $rows
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Write-Output "$failed of $($tests.Count) test scripts failed in PowerShell 7."
          if ($failed -gt 0) { throw "$failed test script(s) failed in PowerShell 7." }

  # .NET 10 build of the service, the starter and the session starter (phase 1 of the move to .NET 10 / PowerShell 7).
  # Builds with tools\Build-SelfXBinaries.ps1 twice and compares the SHA256 (the build must be reproducible), checks the result the way
  # Install.ps1 does, loads the session starter in Windows PowerShell 5.1 and starts the service once in console mode.
  dotnet-build:
    name: Build with .NET 10 (self-contained)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the .NET SDKs of the runner
        shell: pwsh
        run: dotnet --list-sdks

      - name: Build with tools\Build-SelfXBinaries.ps1 (twice) and compare
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'tools\Build-SelfXBinaries.ps1'
          $one = Join-Path $env:RUNNER_TEMP 'bin-one'
          $two = Join-Path $env:RUNNER_TEMP 'bin-two'
          & $script -OutputFolder $one
          & $script -OutputFolder $two
          $failed = $false
          foreach ($file in Get-ChildItem -LiteralPath $one -File -Recurse) {
            $relative = $file.FullName.Substring($one.Length + 1)
            $a = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
            $b = (Get-FileHash -LiteralPath (Join-Path $two $relative) -Algorithm SHA256).Hash
            # The manifest contains the build time and so differs; the programs must be identical.
            if ($file.Name -eq 'SelfX.Binaries.json') { continue }
            '{0}  {1}  {2:N1} MB  {3}' -f $a, $relative, ($file.Length / 1MB), $(if ($a -eq $b) { 'reproducible' } else { 'DIFFERENT' })
            if ($a -ne $b) { $failed = $true }
          }
          if ($failed) { throw 'The two builds are not identical.' }
          # The package folder of the checks below: Bin of the first build.
          $bin = Join-Path $env:GITHUB_WORKSPACE 'SelfX Service\Bin'
          if (Test-Path -LiteralPath $bin) { Remove-Item -LiteralPath $bin -Recurse -Force }
          Copy-Item -LiteralPath $one -Destination $bin -Recurse
          Get-Content -LiteralPath (Join-Path $one 'SelfX.Binaries.json') -Raw

      - name: SBOM (tools\New-SelfXSbom.ps1) is written and consistent with the build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'sbom.cdx.json'
          & (Join-Path $env:GITHUB_WORKSPACE 'tools\New-SelfXSbom.ps1') -OutputFile $out
          $bom = Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($bom.bomFormat -ne 'CycloneDX' -or $bom.specVersion -ne '1.5') { throw 'Not a CycloneDX 1.5 document.' }
          $files = @($bom.components | Where-Object type -eq 'file')
          $libs = @($bom.components | Where-Object type -eq 'library')
          if ($files.Count -lt 3) { throw "Too few program entries: $($files.Count)" }
          if (-not ($libs | Where-Object { $_.name -eq 'System.ServiceProcess.ServiceController' })) { throw 'ServiceController package is missing.' }
          foreach ($file in $files) { if ($file.hashes[0].content -notmatch '^[0-9a-f]{64}$') { throw "Bad hash for $($file.name)" } }
          foreach ($lib in $libs) { if ($lib.hashes -and $lib.hashes[0].content -notmatch '^[0-9a-f]{128}$') { throw "Bad hash for $($lib.name)" } }
          "SBOM: $($files.Count) programs, $($libs.Count) packages."

      - name: Install.ps1 check accepts the build; session starter loads in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:GITHUB_WORKSPACE 'SelfX Service'
          # Take only the check function out of Install.ps1 (the script itself would install SelfX).
          $ast = [Management.Automation.Language.Parser]::ParseFile((Join-Path $package 'Install.ps1'), [ref]$null, [ref]$null)
          $definition = $ast.Find({ param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Test-SelfXPrebuiltBinaries' }, $true)
          . ([scriptblock]::Create($definition.Extent.Text))
          Test-SelfXPrebuiltBinaries -BinFolder (Join-Path $package 'Bin') -PackageFolder $package
          'Install.ps1 accepts Bin of this build.'
          # The same call as Install.ps1 uses to start the status icon: the netstandard2.0 library in .NET Framework.
          Add-Type -LiteralPath (Join-Path $package 'Bin\SelfXSessionStarter.dll')
          'Active sessions: ' + (([SelfXInstall.SessionStarter]::GetActiveSessionIds()) -join ', ')

      - name: Delete helper of SelfXService.exe (M1) - Install.ps1 data folder tests and Test-SafeDelete.ps1 with the built Bin
        shell: powershell
        env:
          SELFX_REQUIRE_BIN: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:GITHUB_WORKSPACE 'SelfX Service'
          foreach ($shell in 'powershell.exe', (Get-Command pwsh).Source) {
            foreach ($test in 'Test-InstallBinaries.ps1', 'Test-SafeDelete.ps1') {
              "::group::$test in $shell"
              & $shell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $package $test)
              $code = $LASTEXITCODE
              '::endgroup::'
              if ($code -ne 0) { throw "$test failed in $shell (exit code $code)." }
            }
          }

      - name: SelfXWinRT.dll loads in PowerShell 7 (with the Windows SDK projection)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:GITHUB_WORKSPACE 'SelfX Service\Bin\WinRT'
          Get-ChildItem -LiteralPath $folder | Format-Table Name, Length
          [void][Reflection.Assembly]::LoadFrom((Join-Path $folder 'SelfXWinRT.dll'))
          # An invalid client id is refused before the API is touched; calling the method also loads the projection DLLs.
          foreach ($bad in '', 'a b', 'x;y', ('a' * 65)) {
            try { [void][SelfX.SelfXWinRT]::CreateUpdateManager($bad); throw "Client id '$bad' was accepted." }
            catch [System.ArgumentException] { "Refused client id (length $($bad.Length))." }
            catch { if ($_.Exception.InnerException -is [System.ArgumentException]) { "Refused client id (length $($bad.Length))." } else { throw } }
          }
          # The orchestrator exists on Windows 11 24H2 and newer only; the runner may not have it.
          try {
            $manager = [SelfX.SelfXWinRT]::CreateUpdateManager('SelfX.CI')
            "Manager created: $($manager.GetType().FullName), IsScanning=$($manager.IsScanning)"
          } catch { "Orchestrator not available on this runner: $($_.Exception.GetType().FullName): $($_.Exception.Message)" }

      - name: SelfXAudio.dll loads in PowerShell 7 (Core Audio, action "No sound")
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:GITHUB_WORKSPACE 'SelfX Service\Bin\Audio'
          Get-ChildItem -LiteralPath $folder | Format-Table Name, Length
          if (@(Get-ChildItem -LiteralPath $folder).Count -ne 1) { throw 'Bin\Audio must contain SelfXAudio.dll only.' }
          [void][Reflection.Assembly]::LoadFrom((Join-Path $folder 'SelfXAudio.dll'))
          # An invalid minimum volume is refused before the audio service is touched.
          foreach ($bad in -1, 101, 1000) {
            try { [void][SelfX.SelfXAudio]::Restore($bad); throw "Minimum volume $bad was accepted." }
            catch [System.ArgumentException] { "Refused minimum volume $bad." }
            catch { if ($_.Exception.InnerException -is [System.ArgumentException]) { "Refused minimum volume $bad." } else { throw } }
          }
          # The runner has no playback device: the call must end with a clear result or exception, never hang or crash.
          try {
            $result = [SelfX.SelfXAudio]::Restore(30)
            "Result: $($result | Out-String)"
          } catch { "No playback device on this runner: $($_.Exception.GetType().FullName): $($_.Exception.Message)" }

      - name: Start the service in console mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'SelfX Service\Bin\SelfXService.exe'
          $pipe = 'SelfX.CI.' + [guid]::NewGuid().ToString('N')
          $log = Join-Path $env:RUNNER_TEMP 'svc-logs'
          $process = Start-Process -FilePath $exe -ArgumentList '/console', "/pipe:$pipe", "/logdir:$log" -PassThru -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'svc.out') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'svc.err')
          Start-Sleep -Seconds 5
          $alive = -not $process.HasExited
          $pipeExists = Test-Path "\\.\pipe\$pipe"
          Get-Content (Join-Path $env:RUNNER_TEMP 'svc.out'), (Join-Path $env:RUNNER_TEMP 'svc.err') -ErrorAction SilentlyContinue
          if ($alive) { Stop-Process -Id $process.Id -Force }
          "alive=$alive pipe=$pipeExists"
          if (-not ($alive -and $pipeExists)) { throw 'The service did not start or did not create its pipe.' }
