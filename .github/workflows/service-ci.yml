# CI for SelfX Service: compiles the service, runs all isolated tests and a security-focused script analysis.
# Runs on GitHub-hosted Windows runners only; nothing is installed on a real device and no secret is used.
name: SelfX Service CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token: the workflow never writes to the repository.
permissions:
  contents: read

concurrency:
  group: service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile and tests (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to a full commit SHA (tag in the comment); Dependabot proposes updates.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Compile service, launcher and session starter
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Join-Path $env:GITHUB_WORKSPACE 'SelfX Service\Service'
          $out = Join-Path $env:RUNNER_TEMP 'selfx-build'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          # Same compiler and references as Install.ps1 (C# compiler of the .NET Framework).
          Add-Type -TypeDefinition (Get-Content -LiteralPath (Join-Path $service 'SelfXService.cs') -Raw) `
            -ReferencedAssemblies 'System.ServiceProcess', 'System.Xml' `
            -OutputAssembly (Join-Path $out 'SelfXService.exe') -OutputType ConsoleApplication
          Add-Type -TypeDefinition (Get-Content -LiteralPath (Join-Path $service 'SelfXLauncher.cs') -Raw) `
            -OutputAssembly (Join-Path $out 'SelfX.exe') -OutputType WindowsApplication
          Add-Type -TypeDefinition (Get-Content -LiteralPath (Join-Path $service 'SelfXSessionStarter.cs') -Raw)
          Get-ChildItem -LiteralPath $out -Filter *.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash, $_.Name }

      - name: Run all Test-*.ps1 of SelfX Service
        shell: powershell
        env:
          SELFX_TEST_TRACE: '1'
        run: |
          $failed = New-Object System.Collections.Generic.List[string]
          $tests = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'SelfX Service') -Filter 'Test-*.ps1' | Sort-Object Name
          foreach ($test in $tests) {
            Write-Output "::group::$($test.Name)"
            # Each test in its own process, so mocks and globals of one test cannot affect the next.
            # A test that does not end within 5 minutes is stopped and its output so far is shown.
            $outFile = Join-Path $env:RUNNER_TEMP "$($test.BaseName).out.txt"
            $errFile = Join-Path $env:RUNNER_TEMP "$($test.BaseName).err.txt"
            $process = Start-Process -FilePath 'powershell.exe' -PassThru -NoNewWindow `
              -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "`"$($test.FullName)`"" `
              -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            $null = $process.Handle   # keeps the exit code readable after the process ended
            $code = 0
            if (-not $process.WaitForExit(300000)) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
              $code = 124
              Write-Output "Timeout after 5 minutes."
            } else { $process.WaitForExit(); $code = $process.ExitCode }
            Get-Content -LiteralPath $outFile, $errFile -ErrorAction SilentlyContinue | Write-Output
            Write-Output '::endgroup::'
            if ($code -ne 0) { $failed.Add("$($test.Name) (exit code $code)"); Write-Output "::error::$($test.Name) failed with exit code $code" }
          }
          if ($failed.Count -gt 0) { throw "Failed tests: $($failed -join ', ')" }
          Write-Output "$($tests.Count) test scripts passed."

  script-analysis:
    name: PSScriptAnalyzer (security rules)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Analyze SelfX Service and tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Fixed version from the PowerShell Gallery.
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Repository PSGallery -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.23.0
          $settings = Join-Path $env:GITHUB_WORKSPACE '.github\PSScriptAnalyzerSettings.psd1'
          $results = @('SelfX Service', 'tools') | ForEach-Object {
            Invoke-ScriptAnalyzer -Path (Join-Path $env:GITHUB_WORKSPACE $_) -Recurse -Settings $settings
          }
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 220
          foreach ($r in $results) { Write-Output "::error file=$($r.ScriptPath),line=$($r.Line)::$($r.RuleName): $($r.Message)" }
          if (@($results).Count -gt 0) { throw "$(@($results).Count) findings." }
          Write-Output 'No findings.'

  # Preparation for the move to PowerShell 7 (see docs: migration plan). Information only: this job never fails
  # the workflow (continue-on-error). It runs every test in PowerShell 7 and lists which ones pass or fail.
  pwsh7-compatibility:
    name: Information - tests in PowerShell 7 (not blocking)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run all Test-*.ps1 in PowerShell 7
        shell: pwsh
        env:
          SELFX_TEST_TRACE: '1'
        run: |
          Write-Output "PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))"
          $pwsh = (Get-Command pwsh).Source
          $rows = New-Object System.Collections.Generic.List[string]
          $failed = 0
          $tests = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'SelfX Service') -Filter 'Test-*.ps1' | Sort-Object Name
          foreach ($test in $tests) {
            Write-Output "::group::$($test.Name)"
            $outFile = Join-Path $env:RUNNER_TEMP "pwsh7-$($test.BaseName).out.txt"
            $errFile = Join-Path $env:RUNNER_TEMP "pwsh7-$($test.BaseName).err.txt"
            $process = Start-Process -FilePath $pwsh -PassThru -NoNewWindow `
              -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "`"$($test.FullName)`"" `
              -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            $null = $process.Handle
            if (-not $process.WaitForExit(300000)) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
              $code = 124
            } else { $process.WaitForExit(); $code = $process.ExitCode }
            Get-Content -LiteralPath $outFile, $errFile -ErrorAction SilentlyContinue | Select-Object -Last 60 | Write-Output
            Write-Output '::endgroup::'
            if ($code -eq 0) { $rows.Add("| $($test.Name) | passed |") } else { $failed++; $rows.Add("| $($test.Name) | FAILED (exit code $code) |") }
          }
          $summary = @("### Tests in PowerShell $($PSVersionTable.PSVersion) (information only)", '', '| Test | Result |', '| --- | --- |') + $rows
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Write-Output "$failed of $($tests.Count) test scripts failed in PowerShell 7 (not blocking)."

  # .NET 10 build of the service, the starter and the session starter (phase 1 of the move to .NET 10 / PowerShell 7).
  # Builds twice and compares the SHA256 (the build must be reproducible) and starts the service once in console mode.
  dotnet-build:
    name: Build with .NET 10 (self-contained)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Show the .NET SDKs of the runner
        shell: pwsh
        run: dotnet --list-sdks

      - name: Publish twice and compare
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'SelfX Service\Service\Projects') -Filter *.csproj -Recurse
          foreach ($run in 'one', 'two') {
            $out = Join-Path $env:RUNNER_TEMP "publish-$run"
            foreach ($project in $projects) {
              dotnet publish $project.FullName -c Release -o (Join-Path $out $project.BaseName) --nologo -v minimal
              if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed: $($project.Name)" }
            }
          }
          $failed = $false
          foreach ($file in Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'publish-one') -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' }) {
            $other = Join-Path (Join-Path $env:RUNNER_TEMP 'publish-two') $file.FullName.Substring((Join-Path $env:RUNNER_TEMP 'publish-one').Length + 1)
            $a = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
            $b = (Get-FileHash -LiteralPath $other -Algorithm SHA256).Hash
            '{0}  {1}  {2:N1} MB  {3}' -f $a, $file.Name, ($file.Length / 1MB), $(if ($a -eq $b) { 'reproducible' } else { 'DIFFERENT' })
            if ($a -ne $b) { $failed = $true }
          }
          if ($failed) { throw 'The two builds are not identical.' }

      - name: Start the service in console mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'publish-one\SelfXService\SelfXService.exe'
          $pipe = 'SelfX.CI.' + [guid]::NewGuid().ToString('N')
          $log = Join-Path $env:RUNNER_TEMP 'svc-logs'
          $process = Start-Process -FilePath $exe -ArgumentList '/console', "/pipe:$pipe", "/logdir:$log" -PassThru -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'svc.out') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'svc.err')
          Start-Sleep -Seconds 5
          $alive = -not $process.HasExited
          $pipeExists = Test-Path "\\.\pipe\$pipe"
          Get-Content (Join-Path $env:RUNNER_TEMP 'svc.out'), (Join-Path $env:RUNNER_TEMP 'svc.err') -ErrorAction SilentlyContinue
          if ($alive) { Stop-Process -Id $process.Id -Force }
          "alive=$alive pipe=$pipeExists"
          if (-not ($alive -and $pipeExists)) { throw 'The service did not start or did not create its pipe.' }
